# gitleaks 仓级配置:默认规则集 + 本仓定制。
# 分层原则:这里只放形态规则与误报豁免;具体敏感词(手机号、内部域名、口令)
# 永远不进本文件——它们属于 configs/secret-scan.local.txt(不入库)。

[extend]
useDefault = true

# 全局误报豁免(对所有规则生效)
[allowlist]
description = "本仓已确认的误报形态"
regexTarget = "line"
regexes = [
  # bash/zsh 连续空赋值声明链(如 local workspace="" sourceKey="" viaAncestor="false"),
  # generic-api-key 会把链中后一个变量名连同 = 误捕为 secret
  '''(\w+=""\s*){2,}''',
]

# 真实 home 目录路径:/Users/<真名>、/home/<真名>、C:\Users\<真名>
# 文档占位名(alice/your-username 等)经 allowlist 豁免
[[rules]]
id = "home-path-leak"
description = "本机用户目录绝对路径泄漏"
regex = '''(/Users/|/home/|[A-Z]:\\Users\\)[A-Za-z0-9._-]+'''
keywords = ["/users/", "/home/", "\\users\\"]

  [rules.allowlist]
  regexTarget = "match"
  regexes = [
    '''(?i)(/users/|/home/|\\users\\)(alice|bob|john|jane|example|sample|placeholder|test|xxx*|your[-_]?[a-z]*|<[^>]*>|\{[^}]*\}|\$\{?[^}]*\}?|user(name)?|me)\b''',
  ]

# AI/云厂商 key:默认规则集不覆盖(anthropic 无规则、openai 仅旧格式),
# 按本仓真实风险面补;前缀特征强,不设熵阈值
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API Key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

[[rules]]
id = "openai-api-key"
description = "OpenAI API Key(含 sk-proj 新格式;与 anthropic 规则对 sk-ant- 双命中,报告层按行去重)"
regex = '''sk-(?:proj-)?[A-Za-z0-9_-]{20,}'''
keywords = ["sk-"]

[[rules]]
id = "aliyun-access-key"
description = "阿里云 AccessKey ID"
regex = '''LTAI[A-Za-z0-9]{12,}'''
keywords = ["LTAI"]

# 中国大陆手机号:1[3-9] 开头 11 位;RE2 不支持 lookaround,
# 用捕获组隔离:secretGroup 让命中的 secret 仅为中间 11 位号码段,
# 两侧非数字字符仅作边界、不计入 secret
[[rules]]
id = "cn-mobile"
description = "中国大陆手机号"
regex = '''(^|[^0-9])(1[3-9][0-9]{9})([^0-9]|$)'''
secretGroup = 2
keywords = []
